name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python tests/test_subsift.py
      - name: CLI smoke test
        run: |
          python subsift.py examples/sample.txt --interesting --stats
          printf 'admin.dev.example.com\nstatic.assets.example.com\n' | python subsift.py --json
